# kitty.conf — converted from NixOS home-manager sources
#   /etc/nixos/home-manager/shell/kitty/default.nix
#   /etc/nixos/home-manager/shell/kitty/settings.nix
#
# Plain upstream kitty.conf syntax: one "key value" pair per line.
# Install to: ~/.config/kitty/kitty.conf

# --- Fonts ------------------------------------------------------------------
font_family Maple Mono NF
font_size 9.4
bold_font auto
italic_font auto
bold_italic_font auto
disable_ligatures never

# --- Display server & shell --------------------------------------------------
linux_display_server wayland
# NixOS used /run/current-system/sw/bin/zsh. Portable path on a normal distro:
shell /usr/bin/zsh

# home-manager defaults shellIntegration.mode to "no-rc" and injects this line,
# so the generated NixOS kitty.conf had it even though the Nix never said so.
shell_integration no-rc

# --- Cursor ------------------------------------------------------------------
cursor_shape beam
cursor_trail 1
cursor_text_color #1E1E2E

# --- Scrollback & redraw -----------------------------------------------------
scrollback_lines 10000
repaint_delay 10
sync_to_monitor yes
confirm_os_window_close 0
window_padding_width 6

# --- Colours (Catppuccin Mocha palette) --------------------------------------
foreground #CDD6F4
background #1E1E2E
cursor #F5E0DC
url_color #B4BEFE

active_border_color #CBA6F7
inactive_border_color #8E95B3
bell_border_color #EBA0AC

selection_foreground none
selection_background #28344a

# --- Tabs --------------------------------------------------------------------
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_background #11111B
active_tab_foreground #11111B
active_tab_background #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# --- Titlebars ---------------------------------------------------------------
wayland_titlebar_color system
macos_titlebar_color system

# --- Marks (used by the diff kitten) -----------------------------------------
mark1_foreground #1E1E2E
mark1_background #87B0F9
mark2_foreground #1E1E2E
mark2_background #CBA6F7
mark3_foreground #1E1E2E
mark3_background #74C7EC

# --- 16 ANSI colours ---------------------------------------------------------
color0 #43465A
color1 #F38BA8
color2 #A6E3A1
color3 #F9E2AF
color4 #87B0F9
color5 #F5C2E7
color6 #94E2D5
color7 #CDD6F4
color8 #43465A
color9 #F38BA8
color10 #A6E3A1
color11 #F9E2AF
color12 #87B0F9
color13 #F5C2E7
color14 #94E2D5
color15 #A1A8C9

# --- Opacity -----------------------------------------------------------------
background_opacity 0.90

# --- Optional: colour scheme used before home-manager took over ---------------
# Lives at ~/.config/kitty/themes/noctalia.conf. Uncomment to apply it INSTEAD
# of the palette above (it only sets colours, so it must come after them).
# include themes/noctalia.conf
# include themes/noctalia.conf
include themes/noctalia.conf
