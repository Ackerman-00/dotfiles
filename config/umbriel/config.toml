[animation]
curve = "easeout"
duration_ms = 200
enabled = true

[animation.border]
curve = "easeout"
duration_ms = 300
enabled = true

[animation.dim_unfocused]
curve = "easeout"
dim = 0.0
duration_ms = 250
enabled = false

[animation.layers]
curve = "easeout"
duration_ms = 200
enabled = true

[animation.overview]
curve = "easeout"
duration_ms = 250
enabled = true

[animation.scratchpad]
blur = true
curve = "easeout"
dim = 0.5
duration_ms = 250
enabled = true
fullscreen = false
maximize = false
scale = 0.0

[animation.windows_in]
curve = "easeout"
duration_ms = 250
effect = "open"
enabled = true
style = "zoom"

[animation.windows_move]
curve = "easeout"
duration_ms = 250
enabled = true

[animation.windows_out]
curve = "easeout"
duration_ms = 250
effect = "close"
enabled = true
style = "slide"

[animation.workspaces]
curve = "ease"
duration_ms = 300
enabled = true

[appearance]
border_width = 2
corner_radius = 1
drag_opacity = 0.9
outer_border_width = 0
prefer_no_csd = true

[appearance.blur]
brightness = 0.9
contrast = 0.9
enabled = true
noise = 0.02
optimized = true
passes = 2
radius = 5
saturation = 1.1

[appearance.shadow]
enabled = true
offset_x = 2
offset_y = 2
softness = 10

[effects.preset.close]
kind = "animation"
shader = "shaders/close.glsl"

[effects.preset.open]
kind = "animation"
shader = "shaders/open.glsl"

[environment]
EGL_PLATFORM = "wayland"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
GTK_IM_MODULE = "simple"
MOZ_DBUS_REMOTE = "1"
MOZ_ENABLE_WAYLAND = "1"
QT_AUTO_SCREEN_SCALE_FACTOR = "1"
QT_QPA_PLATFORMTHEME = "qt6ct"
TERM = "kitty"
TERMINAL = "kitty"
_JAVA_AWT_WM_NONREPARENTING = "1"

[general]
autostart = ["noctalia"]
focus_on_activate = false
honor_restored_maximize = false
mod_key = "Super"
show_cheatsheet = false
xwayland = true

[hot_corners.bottom_left]
action = "overview-toggle"
delay_ms = 500
enabled = false

[hot_corners.bottom_right]
action = "spawn:notify-send 'Bottom right'"
delay_ms = 500
enabled = false

[hot_corners.top_left]
action = "overview-open"
delay_ms = 500
enabled = false

[hot_corners.top_right]
action = "overview-close"
delay_ms = 500
enabled = false

[include.optional]
files = ["noctalia.toml"]

[input]
middle_click_paste = true
window_drag_toggle = "none"

[input.cursor]
follows_focus = true
hardware_cursor = true
hide_timeout_ms = 0
hide_when_typing = false
size = 24
theme = "Bibata-Modern-Classic"

[input.focus]
follows_mouse = false
follows_mouse_max_scroll = 0.0

[input.keyboard]
layout = "us"
numlock_toggle = true
options = ""
repeat_delay = 250
repeat_rate = 45
track_layout = "global"
variant = ""

[input.mouse]
accel_profile = "flat"
scroll_wheel_step = 60
sensitivity = 0.0

[input.tablet]
enabled = true

[input.touchpad]
natural_scroll = true
tap = true

[keybinds]
