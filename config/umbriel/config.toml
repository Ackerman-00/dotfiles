[[layer_rule]]
blur = true
blur_ignore_alpha = 0.5
blur_optimized = false
blur_popups = true

[layer_rule.match]
namespace = '^noctalia-(bar-[^"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^"]*)$'

[layout]
extent_presets = [0.33333, 0.5, 0.66667, 1.0]
gap = 5
mode = "scrolling"

[layout.dwindle]

[layout.master]
default_width_fraction = 0.55
new_on_top = true
position = "left"

[layout.scrolling]
center_focused = "never"
center_underfull_strip = false
default_extent_fraction = 0.66667

[layout.struts]
bottom = 0
left = 0
right = 0
top = 0

[output."Samsung Electric Company S19C170 HYCFB02483"]
direct_scanout = true
enabled = true
hdr = "off"
mode = "1366x768@59.79"
position = [0, 0]
scale = 1
sdr_white = 203
tearing = false
transform = "normal"
vrr = "disabled"

[overview]
zoom = 0.5

