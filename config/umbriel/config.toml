# Firefox-fork PiP windows are titled exactly "Picture-in-Picture".
[[window_rule]]
match.title = "^Picture-in-Picture$"
default_floating = true

# Chromium marks PiP surfaces with the video content type (wp_content_type_manager_v1).
[[window_rule]]
match.app_id = "^([Hh]elium|[Bb]rave|[Cc]hromium)$"
match.content_type = "video"
default_floating = true
