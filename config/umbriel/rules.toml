# Rules

# Gaming
# [[window_rule]]
# match.content_type = "game"
# vrr = "disabled"
# tearing = true
# hdr = "off"
# For Proton/Wine fullscreen: match.xdg_tag = "^proton-game$" + default_fullscreen = true

# Global blur
[[window_rule]]
blur = true
blur_optimized = true
blur_popups = true
blur_ignore_alpha = 0.1

[[window_rule]]
opacity = 1.0

# Games
[[window_rule]]
match.app_id     = "steam_app.*|ffxiv.*"
default_floating = true
opacity          = 1.0
blur             = false
blur_popups      = false
confine_pointer  = true

[[window_rule]]
match.xdg_tag    = "proton-game"
default_floating = true
opacity          = 1.0
blur             = false
blur_popups      = false
confine_pointer  = true

[[window_rule]]
match.content_type = "game"
default_floating   = true
opacity            = 1.0
blur               = false
blur_popups        = false
confine_pointer    = true

[[window_rule]]
match.content_type = "video"
blur = false
opacity = 1.0

[[window_rule]]
match.content_type = "photo"
blur = false
opacity = 1.0

# App opacity
[[window_rule]]
match.app_id = "^(Alacritty|kitty|ghostty|foot)$"
opacity = 0.9

[[window_rule]]
match.app_id = "[Vv]esktop|[Dd]iscord|brave-browser|chromium|helium"
opacity = 0.93

# Focus
[[window_rule]]
match.app_id = "^org.mozilla.firefox$|[Ff]irefox"
blur = true
blur_popups = true
opacity = 1.0
focus_on_activate = true
default_scrolling_column = "browsers"
default_scrolling_column_order = 10
default_column_display = "tabbed"

[[window_rule]]
match.app_id = "^[Zz]en"
blur = false
opacity = 1.0
focus_on_activate = true
default_scrolling_column = "browsers"
default_scrolling_column_order = 15
default_column_display = "tabbed"

# Helium / Brave / Chromium — open-ended to catch distro variants
# (helium-dev, brave-browser-beta, Brave, etc.)
[[window_rule]]
match.app_id = "^([Hh]elium|[Bb]rave|[Cc]hromium)"
focus_on_activate = true
default_scrolling_column = "browsers"
default_scrolling_column_order = 20
default_column_display = "tabbed"

# Nautilus stable — all three are libadwaita CSD: they draw their own
# corners + shadow inside transparent padding, so strip Umbriel's frame
# and keep them opaque with blur off.
[[window_rule]]
match.app_id = "org.gnome.Nautilus|org.gnome.Settings|org.gnome.Loupe"
blur = false
blur_popups = false
opacity = 1.0
border_width = 0
corner_radius = 10
shadow = false

# GTK4/libadwaita CSD padding: compositor blur renders inside the client's
# transparent shadow padding as a visible box. Disable blur for CSD apps.
# Per-window decorations trace back to me: #260 (feature request) ->
# #264 (my impl, closed in favor of) -> #266 (merged Sep 25); the
# outer_border_width idea from #264 followed onto main later.
# Upstream has no appetite for GNOME-specific CSD handling (Discord
# sentiment is... anti-GNOME), so strip the frame per app here.
[[window_rule]]
match.app_id = "org.gnome.TextEditor|gnome-text-editor"
blur = false
opacity = 1.0
border_width = 0
corner_radius = 10
shadow = false

# Floating
[[window_rule]]
match.app_id = "blender"
default_floating = false
opacity = 1.0
blur = false
blur_popups = false

[[window_rule]]
match.app_id = "org.gnome.Loupe"
default_floating = true

[[window_rule]]
match.app_id = "[Kk]vantum|qt5ct|qt6ct|nwg-look|org.kde.ark|pavucontrol|blueman|[Ll]oupe|mpv|[Qq]bittorrent|org.gnome.TextEditor|gnome-text-editor"
default_floating = true

# Kvantum sets no app_id (empty string) — match by title instead
[[window_rule]]
match.title = "[Kk]vantum"
default_floating = true

[[window_rule]]
match.app_id = "[Qq]bittorrent"
default_floating_size_px = { width = 880, height = 500 }

[[window_rule]]
match.title = "^Open$|^Save As$|^Choose Files$|^File Operation Progress$"
default_floating = true

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = false
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = false
default_floating_size_px = { width = 1020, height = 900 }
blur = true
blur_popups = false
opacity = 1.0

# Laptop scratchpad: auto-store, restore to laptop panel
# Launch with: kitty --class scratchpad-terminal
[[window_rule]]
match.app_id = "^scratchpad-terminal$"
default_scratchpad = "default"
default_output = "Samsung Electric Company S19C170 HYCFB02483"

# Layer rules
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_optimized = false
blur_popups = true

