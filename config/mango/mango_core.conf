# ══════════════════════════════════════════════════════════════════════
#  MangoWM
# ══════════════════════════════════════════════════════════════════════

cursor_theme=Bibata-Modern-Classic
cursor_size=24
cursor_hide_timeout=0

# ─── BORDERS ──────────────────────────────────────────────────────────────
border_px=2
no_border_when_single=0
border_color=0x797665ff
focus_color=0xd1c88bff
maximized_screen_color=0xcec7a3ff
urgent_color=0xf97758ff
scratchpad_color=0xffd9aeff
global_color=0xb0ab99ff
overlay_color=0x282619ff

# ─── BLUR ─────────────────────────────────────────────────────────────────
blur=1
blur_layer=1
blur_optimized=0
blur_params_radius=8
blur_params_num_passes=2
blur_params_noise=0.005
blur_params_brightness=0.90
blur_params_contrast=0.90
blur_params_saturation=1.20

# ─── SHADOWS ──────────────────────────────────────────────────────────────
shadows=1
layer_shadows=0
shadow_only_floating=1
shadows_size=12
shadows_blur=15
shadows_position_x=0
shadows_position_y=2
shadows_color=0x000000ff

# ─── OPACITY & CORNERS ────────────────────────────────────────────────────
border_radius=4
focused_opacity=0.85
unfocused_opacity=0.88

# ─── ANIMATIONS ───────────────────────────────────────────────────────────
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.0
fade_out_begin_opacity=0.0
zoom_initial_ratio=0.85
zoom_end_ratio=1.0
tag_animation_direction=1
animation_duration_move=250
animation_duration_open=250
animation_duration_tag=250
animation_duration_close=200
animation_duration_focus=150
animation_curve_open=0.16,1.0,0.3,1.0
animation_curve_move=0.16,1.0,0.3,1.0
animation_curve_tag=0.16,1.0,0.3,1.0
animation_curve_close=0.16,1.0,0.3,1.0
animation_curve_focus=0.16,1.0,0.3,1.0
animation_curve_opacity_fade_in=0.16,1.0,0.3,1.0
animation_curve_opacity_fade_out=0.16,1.0,0.3,1.0

# ─── SCROLLER ─────────────────────────────────────────────────────────────
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=0
edge_scroller_focus_allow_speed=0
scroller_prefer_overspread=1
scroller_ignore_proportion_single=1
scroller_proportion_preset=0.5,0.8,1.0

# ─── MASTER-STACK ─────────────────────────────────────────────────────────
new_is_master=1
default_master_factor=0.55
default_master_count=1
smart_gaps=0

# ─── DWINDLE ──────────────────────────────────────────────────────────────
dwindle_split_ratio=0.5
dwindle_smart_split=1
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1
dwindle_smart_resize=1
dwindle_drop_simple_split=1
dwindle_manual_split=0

# ─── TAB MODE (0.18.0 successor to ov_tab_mode) ───────────────────────────
monocle_tab_mode=1
deck_tab_mode=1

# ─── TAG RULES ────────────────────────────────────────────────────────────
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:fair
tag_rule=id:9,layout_name:deck

# ─── OVERVIEW ─────────────────────────────────────────────────────────────
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
hotarea_corner=2
jump_labels=HJKLASDFGQWERTYUIOPZXCVBNM
overview_gap_inner=5

# ─── SPECIAL WORKSPACE ────────────────────────────────────────────────────
special_dim=0.5
special_gap_inner_horizontal=10
special_gap_inner_vertical=10
special_gap_outer_horizontal=20
special_gap_outer_vertical=20

# ─── GAPS ─────────────────────────────────────────────────────────────────
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=8
gap_outer_vertical=8
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# ─── SYSTEM ───────────────────────────────────────────────────────────────
auto_reload_config=1
cursor_hide_on_keypress=1
xwayland_persistence=1
sync_obj_enable=1
allow_tearing=2
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=1
sloppy_focus=0
warp_cursor=0
focus_cross_monitor=0
focus_cross_tag=0
exchange_cross_monitor=1
circle_layout=tile,scroller
enable_floating_snap=1
snap_distance=30
drag_tile_to_tile=1
drag_corner=3
drag_warp_cursor=1
single_scratchpad=1
tag_carousel=0
axis_bind_apply_timeout=100

# ─── KEYBOARD ─────────────────────────────────────────────────────────────
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# ─── TRACKPAD ─────────────────────────────────────────────────────────────
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# ─── MOUSE ────────────────────────────────────────────────────────────────
mouse_natural_scrolling=0
mouse_accel_profile=2
mouse_accel_speed=0.0
