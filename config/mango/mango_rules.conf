# ══════════════════════════════════════════════════════════════════════
#  MangoWM Window Rules
# ══════════════════════════════════════════════════════════════════════

# ─── OPACITY & BLUR ───────────────────────────────────────────────────────
window_rule=focused_opacity:0.90,unfocused_opacity:0.87,app_id:nemo

window_rule=no_blur:1,focused_opacity:1,unfocused_opacity:1,app_id:brave-browser
window_rule=no_blur:1,focused_opacity:1,unfocused_opacity:1,app_id:zen.*
window_rule=no_blur:1,focused_opacity:1,unfocused_opacity:1,app_id:blender

window_rule=focused_opacity:0.90,unfocused_opacity:0.87,app_id:firefox
window_rule=focused_opacity:0.90,unfocused_opacity:0.87,app_id:chromium
window_rule=focused_opacity:0.90,unfocused_opacity:0.87,app_id:google-chrome

window_rule=focused_opacity:0.90,unfocused_opacity:0.87,app_id:vlc
window_rule=focused_opacity:0.90,unfocused_opacity:0.87,app_id:mpv
window_rule=focused_opacity:0.90,unfocused_opacity:0.87,app_id:celluloid

window_rule=no_blur:1,focused_opacity:1,unfocused_opacity:1,app_id:steam
window_rule=no_blur:1,focused_opacity:1,unfocused_opacity:1,app_id:steam_app.*
window_rule=no_blur:1,focused_opacity:1,unfocused_opacity:1,app_id:heroic*
window_rule=no_blur:1,focused_opacity:1,unfocused_opacity:1,app_id:lutris
window_rule=no_blur:1,focused_opacity:1,unfocused_opacity:1,app_id:faugus-launcher

window_rule=confine_pointer:1,app_id:steam_app.*
window_rule=confine_pointer:1,app_id:heroic*

window_rule=focused_opacity:0.80,unfocused_opacity:0.87,app_id:eog
window_rule=focused_opacity:0.80,unfocused_opacity:0.96,app_id:org.gnome.Loupe
window_rule=focused_opacity:0.80,unfocused_opacity:0.82,app_id:gimp
window_rule=focused_opacity:0.80,unfocused_opacity:0.82,app_id:inkscape

# ─── PIP ──────────────────────────────────────────────────────────────────
window_rule=is_floating:1,is_global:1,width:480,height:270,offset_x:90,offset_y:90,title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

