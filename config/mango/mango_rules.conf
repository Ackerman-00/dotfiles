# ─── LAYER RULES ──────────────────────────────────────────────────────────
layer_rule=no_blur:1,layer_name:selection
layer_rule=no_blur:1,layer_name:wlroots-screencopy
layer_rule=no_blur:1,layer_name:slurp
layer_rule=no_blur:1,layer_name:rofi
layer_rule=no_blur:1,layer_name:blender
layer_rule=no_blur:1,layer_name:notifications
layer_rule=no_blur:1,layer_name:swaync-notification-window
layer_rule=no_blur:1,layer_name:swaync-control-center
layer_rule=no_blur:1,layer_name:logout_dialog
# mist-shell: bar strip gets blur (glass look); full-screen panel must NOT blur the desktop
layer_rule=no_blur:1,layer_name:mist-panel
layer_rule=no_blur:1,no_animation:1,layer_name:msnap
